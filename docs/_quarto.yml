project:
  type: website
  output-dir: _site

website:
  title: "homomorphepy"
  description: "Multi-site privacy-preserving statistics over homomorphic encryption"
  site-url: https://bnaras.github.io/homomorphepy
  favicon: logo_240.png
  navbar:
    logo: logo_240.png
    logo-alt: "homomorphepy hex logo"
    left:
      - href: index.qmd
        text: Home
      - href: introduction.qmd
        text: Introduction
      # Grouped by what the reader is trying to do, not by scheme.
      # Order matches the "Which page to read" section of
      # introduction.qmd; keep the two in step.
      - text: Examples
        menu:
          - aggregation.qmd
          - query-count.qmd
          - text: "---"
          - mle.qmd
          - cox.qmd
          - cox-threshold.qmd
          - cox-lasso.qmd
          - text: "---"
          - secure-inference.qmd
          - encrypted-regression.qmd
          - similarity.qmd
          - text: "---"
          - dp.qmd
          - consensus-admm-dp.qmd
      - href: precision.qmd
        text: Precision
    right:
      - icon: github
        href: https://github.com/bnaras/homomorphepy
        aria-label: GitHub

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    code-fold: false
    df-print: kable
  # Every page is also rendered to an executed notebook, with outputs
  # and the inline values substituted, linked from the page under
  # "Other Formats".
  ipynb: default

# Documents execute at render time: every number in the prose comes
# from code that ran, never from a value typed by hand. `freeze`
# stays false so a stale cache cannot silently outlive the code.
execute:
  freeze: false
  warning: false

# Cap OpenMP before the extension module loads. This has to be process
# level rather than in a chunk, because OpenFHE latches its thread
# count when the shared library is first imported.
jupyter:
  kernelspec:
    name: python3
    language: python
    display_name: Python 3
