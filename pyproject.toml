[project]
name = "homomorphepy"
version = "1.0"
description = "Multi-site privacy-preserving statistics over homomorphic encryption — the Python twin of homomorpheR"
readme = "README.md"
license = "MIT"
authors = [{ name = "Balasubramanian Narasimhan", email = "naras@stat.Stanford.EDU" }]
# 3.10 is the openfhe-python source-build floor (its CMake branches on
# >= 3.10). The PyPI `openfhe` wheel is narrower still — CPython 3.12,
# x86_64, Ubuntu — see the `openfhe` extra and docs/install.md.
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
# NOT a hard dependency, deliberately. The PyPI `openfhe` wheels are
# tagged py3-none-any but contain cpython-312-x86_64-linux-gnu binaries
# with Ubuntu-specific shared libraries. pip therefore "succeeds" on
# macOS and on CPython != 3.12, and `import openfhe` then fails — a
# hard dependency would make `uv sync` green and every test red.
#
# The version is pinned to all six components on purpose: the Ubuntu
# release is encoded in the VERSION, not the wheel tag, so a `.*` pin
# resolves to the highest (24.04) build even on 22.04.
#
# The marker pins CPython 3.12 exactly rather than >=3.12: the payload
# is a `cpython-312-x86_64-linux-gnu` binary, so it does not import on
# 3.13 either, despite the wheel's `py3-none-any` tag and its
# `Requires-Python: >=3.12` claiming otherwise.
openfhe = [
    "openfhe==1.5.1.0.24.4; sys_platform == 'linux' and platform_machine == 'x86_64' and python_full_version >= '3.12' and python_full_version < '3.13'",
]

stats = ["statsmodels>=0.14", "cvxpy>=1.5", "clarabel>=0.9"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "statsmodels>=0.14.6",
    "lifelines>=0.30.0",
    "cvxpy>=1.7.5",
    "clarabel>=0.11.1",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "great-tables>=0.23.0",
    "matplotlib>=3.10.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homomorphepy"]

[tool.hatch.build.targets.sdist]
# The fixtures under src/homomorphepy/fixtures/ are committed here and are
# the single copy; homomorpheR's data-raw/sync_fixtures.sh regenerates
# them. They travel in the sdist and the wheel, since users have no R to
# regenerate them.
include = ["src/homomorphepy/**", "tests/**", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "openfhe: requires the openfhe extension module (see docs/install.md)",
    "slow: minutes rather than seconds; run with `pytest -m slow`",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
# openfhe-python ships no type stubs, so the crypto boundary is Any.
# Everything else stays checkable behind the typed facade in _backend.py.
reportMissingImports = false
typeCheckingMode = "basic"
